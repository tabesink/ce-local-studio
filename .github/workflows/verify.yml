name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  root-verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/client/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.8.9'
      - name: Run root verification
        run: bash scripts/verify.sh

  # Disposable PostgreSQL 16 proofs (opt-in env). Parallel with root-verification;
  # both are required merge gates. Live Compose smoke and Playwright stay out.
  verify-postgresql:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: context_engine
          POSTGRES_PASSWORD: context_engine
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U context_engine -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.8.9'
      - name: Run disposable PostgreSQL suite
        working-directory: app
        env:
          CONTEXT_ENGINE_ALLOW_DISPOSABLE_DATABASE_TESTS: '1'
          CONTEXT_ENGINE_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://context_engine:context_engine@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          # Fail closed if opt-in env is missing/mistyped — pytest exits 0 when all
          # postgresql-marked tests skip without CONTEXT_ENGINE_ALLOW_DISPOSABLE_DATABASE_TESTS=1.
          test "${CONTEXT_ENGINE_ALLOW_DISPOSABLE_DATABASE_TESTS}" = "1"
          test -n "${CONTEXT_ENGINE_TEST_POSTGRES_ADMIN_URL}"
          junit="${RUNNER_TEMP:-/tmp}/postgresql-tests.xml"
          uv run --frozen --python 3.12 --extra test pytest -m postgresql \
            --junitxml="$junit" -q --tb=line
          python3 - "$junit" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          root = ET.parse(path).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          if not suites and root.tag == "testsuites":
              suites = list(root)
          tests = sum(int(s.get("tests") or 0) for s in suites)
          failures = sum(int(s.get("failures") or 0) for s in suites)
          errors = sum(int(s.get("errors") or 0) for s in suites)
          skipped = sum(int(s.get("skipped") or 0) for s in suites)
          passed = tests - failures - errors - skipped
          if passed < 1:
              raise SystemExit(
                  f"verify-postgresql ran zero passing tests "
                  f"(tests={tests} passed={passed} skipped={skipped} "
                  f"failures={failures} errors={errors})"
              )
          PY

  # Named Playwright PR-fast lane (P12-07 U3). Production Next + BFF + API + worker + PG.
  # Live Reducto/capacity stays in the gated @release lane (U4), not this job.
  verify-playwright-pr-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/client/package-lock.json
      - name: Materialize stack env for Compose
        working-directory: app
        run: |
          set -euo pipefail
          FERNET="$(python -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          cat > .env.stack.local <<EOF
          POSTGRES_DB=context_engine
          POSTGRES_USER=context_engine
          POSTGRES_PASSWORD=context_engine_ci
          CE_ADMIN_USERNAME=admin.ava
          CE_ADMIN_PASSWORD=CE-Test-Admin-2026!
          CE_SESSION_COOKIE_SECURE=false
          CONTEXT_ENGINE_TESTING=true
          CE_STACK_PUBLIC_ORIGIN=http://127.0.0.1:3000
          CE_INTERNAL_HOSTS=api
          CE_TRUSTED_BFF_PEERS=172.30.55.10/32
          CE_CSRF_SIGNING_KEY=local-dev-csrf-signing-key-min-32b!!
          CE_GRAPH_REF_KEY=local-dev-graph-ref-key-min-32-bytes!!
          CONFIG_ENCRYPTION_KEY=${FERNET}
          STACK_API_PORT=8000
          STACK_FRONTEND_PORT=3000
          EOF
          # Strip leading spaces introduced by the heredoc indent.
          sed -i 's/^[[:space:]]*//' .env.stack.local
          chmod 600 .env.stack.local
      - name: Build and start Compose stack
        working-directory: app
        run: |
          set -euo pipefail
          docker compose --env-file .env.stack.local -f compose.stack.yml up --build -d
      - name: Wait for frontend /login
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              echo "frontend ready"
              exit 0
            fi
            sleep 4
          done
          echo "frontend not ready" >&2
          (cd app && docker compose --env-file .env.stack.local -f compose.stack.yml ps) || true
          (cd app && docker compose --env-file .env.stack.local -f compose.stack.yml logs --tail=200) || true
          exit 1
      - name: Install client deps and Playwright Chromium
        working-directory: app/client
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Build fixtures and run PR-fast Playwright
        working-directory: app/client
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          CE_ADMIN_USERNAME: admin.ava
          CE_ADMIN_PASSWORD: CE-Test-Admin-2026!
        run: |
          set -euo pipefail
          npm run fixtures:verify || npm run fixtures:build
          npm run fixtures:verify
          npm run test:e2e:pr-fast
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pr-fast-artifacts
          path: |
            app/client/test-results/
            app/client/playwright-report/
            app/client/tests/e2e/artifacts/
          if-no-files-found: ignore
      - name: Compose down
        if: always()
        working-directory: app
        run: docker compose --env-file .env.stack.local -f compose.stack.yml down -v || true
