# Ingress-wired HTTP Compose profile (P10-01).
# Primary: fill CE_STACK_PUBLIC_ORIGIN + CE_* from .env.stack.example.
# Secondary bypass: leave CE_STACK_PUBLIC_ORIGIN / CE_* empty with CONTEXT_ENGINE_TESTING=true
# (policy disabled — not deployment evidence).
#
# Trusted BFF peer is the frontend container static IP on ce_stack (172.30.55.10/32).
# The bridge gateway (172.30.55.1) is intentionally outside the peer allowlist so
# host callers of the published API port are not treated as the BFF.

networks:
  ce_stack:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.55.0/24

services:
  postgres:
    image: postgres:16
    networks: [ce_stack]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB locally}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER locally}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD locally}
    # Loopback publish for host-native scripts/dev.sh and scripts/dev.ps1.
    # Compose api/worker still use the internal hostname postgres:5432.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - stack-postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    networks: [ce_stack]
    command: ["python", "-m", "context_engine.migrate_release"]
    environment:
      CONTEXT_ENGINE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER locally}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD locally}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB locally}
      # Required when CONTEXT_ENGINE_TESTING=false (TLS / P12-05); Settings loads on migrate entry.
      CONTEXT_ENGINE_TESTING: ${CONTEXT_ENGINE_TESTING:-true}
      CE_GRAPH_REF_KEY: ${CE_GRAPH_REF_KEY:?set CE_GRAPH_REF_KEY locally}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Insert-only admin seed (P1-02 / DRIFT-21). Never run from API lifespan.
  # CE_ADMIN_* live only on this one-shot service (not api/worker).
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    networks: [ce_stack]
    command: ["python", "-m", "context_engine.bootstrap_admin"]
    environment:
      CONTEXT_ENGINE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER locally}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD locally}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB locally}
      CONTEXT_ENGINE_TESTING: ${CONTEXT_ENGINE_TESTING:-true}
      CE_GRAPH_REF_KEY: ${CE_GRAPH_REF_KEY:?set CE_GRAPH_REF_KEY locally}
      CE_ADMIN_USERNAME: ${CE_ADMIN_USERNAME:?set CE_ADMIN_USERNAME locally}
      CE_ADMIN_PASSWORD: ${CE_ADMIN_PASSWORD:?set CE_ADMIN_PASSWORD locally}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    networks: [ce_stack]
    command: ["python", "-m", "uvicorn", "context_engine.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CONTEXT_ENGINE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER locally}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD locally}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB locally}
      CE_SESSION_COOKIE_SECURE: ${CE_SESSION_COOKIE_SECURE:-false}
      CONTEXT_ENGINE_TESTING: ${CONTEXT_ENGINE_TESTING:-true}
      # Unset → inline follows testing. Set false for worker-path smoke (Compose-dev only).
      CE_INLINE_TURN_WORKERS: ${CE_INLINE_TURN_WORKERS:-}
      CE_PUBLIC_ORIGIN: ${CE_STACK_PUBLIC_ORIGIN:-}
      CE_INTERNAL_HOSTS: ${CE_INTERNAL_HOSTS:-}
      CE_TRUSTED_BFF_PEERS: ${CE_TRUSTED_BFF_PEERS:-}
      CE_CSRF_SIGNING_KEY: ${CE_CSRF_SIGNING_KEY:-}
      CE_GRAPH_REF_KEY: ${CE_GRAPH_REF_KEY:?set CE_GRAPH_REF_KEY locally}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?set CONFIG_ENCRYPTION_KEY locally}
      CE_DOMAIN_RUNTIME_CONTROLLER_KIND: local
      CE_LIGHTRAG_CLIENT_KIND: local
      CE_SOURCE_STORAGE_ROOT: /data/source-storage
      CE_DOMAIN_RUNTIME_ROOT: /data/domain-runtimes
    ports:
      - "127.0.0.1:${STACK_API_PORT:-8000}:8000"
    volumes:
      - stack-source-storage:/data/source-storage
      - stack-domain-runtimes:/data/domain-runtimes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    networks: [ce_stack]
    command: ["python", "-m", "context_engine.worker"]
    environment:
      CONTEXT_ENGINE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER locally}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD locally}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB locally}
      CE_SESSION_COOKIE_SECURE: ${CE_SESSION_COOKIE_SECURE:-false}
      CONTEXT_ENGINE_TESTING: ${CONTEXT_ENGINE_TESTING:-true}
      CE_PUBLIC_ORIGIN: ${CE_STACK_PUBLIC_ORIGIN:-}
      CE_INTERNAL_HOSTS: ${CE_INTERNAL_HOSTS:-}
      CE_TRUSTED_BFF_PEERS: ${CE_TRUSTED_BFF_PEERS:-}
      CE_CSRF_SIGNING_KEY: ${CE_CSRF_SIGNING_KEY:-}
      CE_GRAPH_REF_KEY: ${CE_GRAPH_REF_KEY:?set CE_GRAPH_REF_KEY locally}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?set CONFIG_ENCRYPTION_KEY locally}
      CE_DOMAIN_RUNTIME_CONTROLLER_KIND: local
      CE_LIGHTRAG_CLIENT_KIND: local
      CE_SOURCE_STORAGE_ROOT: /data/source-storage
      CE_DOMAIN_RUNTIME_ROOT: /data/domain-runtimes
      CE_WORKER_IDLE_SECONDS: ${CE_WORKER_IDLE_SECONDS:-2}
      # Distinct turn worker id for Compose leased-path smoke ownership asserts.
      CE_TURN_WORKER_ID: ${CE_TURN_WORKER_ID:-compose-turn-worker}
    volumes:
      - stack-source-storage:/data/source-storage
      - stack-domain-runtimes:/data/domain-runtimes
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
    # Bound for SIGTERM drain of one run_once_pass; hung work falls to kill + lease reclaim.
    stop_grace_period: 60s
    healthcheck:
      # Heartbeat is touched only after internal readiness and each loop iteration.
      # Compose healthy ≠ claim-ready until the worker has passed readiness (see runbook).
      # Stale if mtime older than 30s; start_period covers first boot / long run_once.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,time; p=os.environ.get('CE_DOMAIN_RUNTIME_ROOT','/data/domain-runtimes')+'/.ce-worker-heartbeat'; sys.exit(0 if os.path.isfile(p) and time.time()-os.path.getmtime(p)<30 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Always the compose service DNS name — do not inherit host-native API bases.
        CONTEXT_ENGINE_API_BASE: http://api:8000
    networks:
      ce_stack:
        ipv4_address: 172.30.55.10
    environment:
      CONTEXT_ENGINE_API_BASE: http://api:8000
      CONTEXT_ENGINE_PUBLIC_ORIGIN: ${CE_STACK_PUBLIC_ORIGIN:-}
    ports:
      - "127.0.0.1:${STACK_FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy

volumes:
  # Renaming from p10-postgres-data starts a fresh local database unless you migrate data manually.
  stack-postgres-data:
  stack-source-storage:
  stack-domain-runtimes:
