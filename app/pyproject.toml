[project]
name = "context-engine"
version = "0.1.0"
description = "Context Engine trusted application foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.2",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
lightrag-runtime = [
    "numpy>=1.26.0",
    "json-repair>=0.29.0",
    "python-dotenv>=1.0.0",
    "networkx>=3.2.0",
    "nano-vectordb>=0.0.4",
    "tiktoken>=0.7.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
]
parsers = [
    "docling>=2.0.0",
    "reductoai>=0.1.0",
]
synthesis = [
    "openai>=1.40.0",
]
test = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --basetemp=tests/.pytest-tmp"
markers = [
    "integration_docker: requires a live Docker daemon; used for Slice A controller lifecycle proof",
    "postgresql: requires explicit opt-in and an administrative PostgreSQL 16 test URL",
]

[tool.setuptools.packages.find]
where = [".", "vendor"]
include = ["context_engine*", "lightrag*"]
