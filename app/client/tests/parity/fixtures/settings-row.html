<!--
  Synthetic parity fixture for SettingsRow.
  Not product authority. Not routable. Script-free and network-free.
  Shared scenarios mirror tests/parity/manifests/settings-row.json.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SettingsRow parity fixture (synthetic)</title>
    <style>
      :root {
        --ui-bg: #141414;
        --ui-fg: #f2f2f2;
        --ui-muted: #9a9a9a;
        --ui-hover: #ffffff0d;
        --ui-border: #2a2a2a;
        --ui-success: #3fbf6a;
        --fs-base: 13px;
        --fs-sm: 11px;
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
      }
      [data-theme="zai-light"] {
        --ui-bg: #f4f5f5;
        --ui-fg: #1a1a1a;
        --ui-muted: #6b6b6b;
        --ui-hover: #0d0d0d0b;
        --ui-border: #0d0d0d1a;
        --ui-success: #1e8a3e;
      }
      body {
        margin: 0;
        background: var(--ui-bg);
        color: var(--ui-fg);
      }
      .region {
        padding: 16px;
        border-bottom: 1px solid var(--ui-border);
      }
      .caption {
        margin: 0 0 10px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ui-muted);
      }
      .row {
        display: grid;
        grid-template-columns: minmax(160px, 0.42fr) minmax(0, 1fr);
        gap: 20px;
        align-items: center;
        padding: 10px 14px;
      }
      .row:hover {
        background: color-mix(in oklab, var(--ui-hover) 35%, transparent);
      }
      .label {
        font-size: var(--fs-base);
        font-weight: 500;
        color: var(--ui-fg);
      }
      .description {
        margin-top: 2px;
        font-size: var(--fs-sm);
        color: var(--ui-muted);
      }
      .trailing {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }
      .control {
        display: inline-flex;
        align-items: center;
        padding: 4px 10px;
        border: 1px solid var(--ui-border);
        border-radius: 6px;
        color: var(--ui-muted);
        font-size: var(--fs-sm);
        font-weight: 600;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: var(--fs-sm);
        color: var(--ui-success);
      }
      .status .dot {
        width: 5px;
        height: 5px;
        border-radius: 9999px;
        background: var(--ui-success);
      }
      @media (max-width: 767px) {
        .row {
          grid-template-columns: 1fr;
          gap: 6px;
        }
        .trailing {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <section class="region" data-theme="zai-dark" data-snapshot="theme-dark">
      <p class="caption">zai-dark · row-with-control</p>
      <div class="row" data-snapshot="row-with-control">
        <div>
          <div class="label">Notification preference</div>
          <div class="description">Synthetic preference description for parity only</div>
        </div>
        <div class="trailing">
          <span class="control">Edit</span>
        </div>
      </div>
    </section>
    <section class="region" data-theme="zai-dark" data-snapshot="row-with-status">
      <p class="caption">zai-dark · row-with-status</p>
      <div class="row">
        <div>
          <div class="label">Notification preference</div>
        </div>
        <div class="trailing">
          <span class="status"><span class="dot"></span>Ready</span>
        </div>
      </div>
    </section>
    <section class="region" data-theme="zai-light" data-snapshot="theme-light">
      <p class="caption">zai-light · row-with-control</p>
      <div class="row">
        <div>
          <div class="label">Notification preference</div>
          <div class="description">Synthetic preference description for parity only</div>
        </div>
        <div class="trailing">
          <span class="control">Edit</span>
        </div>
      </div>
    </section>
  </body>
</html>
