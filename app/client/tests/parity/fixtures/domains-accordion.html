<!--
  Synthetic parity fixture for Settings Domain accordion.
  Not product authority. Not routable. Script-free and network-free.
  Shared scenarios mirror tests/parity/manifests/domains-accordion.json.
  No storage ProgressBar chrome. No focus/ARIA/keyboard claims.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Domains accordion parity fixture (synthetic)</title>
    <style>
      :root {
        --ui-bg: #141414;
        --ui-fg: #f2f2f2;
        --ui-muted: #9a9a9a;
        --ui-hover: #ffffff0d;
        --ui-border: #2a2a2a;
        --ui-success: #3fbf6a;
        --fs-base: 13px;
        --fs-xs: 11px;
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
      }
      [data-theme="zai-light"] {
        --ui-bg: #f4f5f5;
        --ui-fg: #1a1a1a;
        --ui-muted: #6b6b6b;
        --ui-hover: #0d0d0d0b;
        --ui-border: #0d0d0d1a;
        --ui-success: #1e8a3e;
      }
      body {
        margin: 0;
        background: var(--ui-bg);
        color: var(--ui-fg);
      }
      .region {
        padding: 16px;
        border-bottom: 1px solid var(--ui-border);
      }
      .caption {
        margin: 0 0 10px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ui-muted);
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
      }
      .header:hover {
        background: color-mix(in oklab, var(--ui-hover) 35%, transparent);
      }
      .chevron {
        width: 14px;
        height: 14px;
        color: var(--ui-muted);
        flex-shrink: 0;
      }
      .chevron.collapsed {
        transform: rotate(-90deg);
      }
      .identity {
        min-width: 0;
        flex: 1;
      }
      .name {
        font-size: var(--fs-base);
        font-weight: 500;
        color: var(--ui-fg);
      }
      .id {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: var(--fs-xs);
        color: var(--ui-muted);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: var(--fs-xs);
        color: var(--ui-success);
      }
      .status .dot {
        width: 5px;
        height: 5px;
        border-radius: 9999px;
        background: var(--ui-success);
      }
      .toggle {
        width: 32px;
        height: 18px;
        border-radius: 9999px;
        background: color-mix(in oklab, var(--ui-success) 55%, var(--ui-border));
        flex-shrink: 0;
      }
      .expand {
        padding: 12px 14px;
        background: color-mix(in oklab, var(--ui-bg) 35%, transparent);
      }
      .fact {
        display: grid;
        gap: 4px;
        margin-bottom: 10px;
      }
      .fact-label {
        font-size: var(--fs-xs);
        color: var(--ui-muted);
      }
      .fact-value {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: var(--fs-xs);
        color: var(--ui-muted);
      }
    </style>
  </head>
  <body>
    <section class="region" data-theme="zai-dark" data-snapshot="theme-dark-collapsed">
      <p class="caption">zai-dark · collapsed</p>
      <div class="header">
        <span class="chevron collapsed" aria-hidden="true">▾</span>
        <div class="identity">
          <div class="name">Synthetic Alpha Domain</div>
          <div class="id">synth-alpha</div>
        </div>
        <span class="status"><span class="dot"></span>Running</span>
        <span class="toggle" aria-hidden="true"></span>
      </div>
    </section>
    <section class="region" data-theme="zai-dark" data-snapshot="theme-dark-expanded">
      <p class="caption">zai-dark · expanded-locked-facts</p>
      <div class="header">
        <span class="chevron" aria-hidden="true">▾</span>
        <div class="identity">
          <div class="name">Synthetic Alpha Domain</div>
          <div class="id">synth-alpha</div>
        </div>
        <span class="status"><span class="dot"></span>Running</span>
        <span class="toggle" aria-hidden="true"></span>
      </div>
      <div class="expand">
        <div class="fact">
          <div class="fact-label">Embedding model</div>
          <div class="fact-value">embed-synth · 768d · locked</div>
        </div>
        <div class="fact">
          <div class="fact-label">Query eligible</div>
          <div class="fact-value">Yes</div>
        </div>
        <div class="fact">
          <div class="fact-label">Runtime ready</div>
          <div class="fact-value">Yes</div>
        </div>
      </div>
    </section>
    <section class="region" data-theme="zai-light" data-snapshot="theme-light-collapsed">
      <p class="caption">zai-light · collapsed</p>
      <div class="header">
        <span class="chevron collapsed" aria-hidden="true">▾</span>
        <div class="identity">
          <div class="name">Synthetic Alpha Domain</div>
          <div class="id">synth-alpha</div>
        </div>
        <span class="status"><span class="dot"></span>Running</span>
        <span class="toggle" aria-hidden="true"></span>
      </div>
    </section>
  </body>
</html>
