<!--
  Synthetic parity fixture for ToggleSwitch.
  Not product authority. Not routable. Script-free and network-free.
  Shared scenarios mirror tests/parity/manifests/toggle-switch.json.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ToggleSwitch parity fixture (synthetic)</title>
    <style>
      :root {
        --ui-bg: #141414;
        --ui-fg: #f2f2f2;
        --ui-muted: #9a9a9a;
        --ui-separator: #2f2f2f;
        --ui-accent: #3b9eff;
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
      }
      [data-theme="zai-light"] {
        --ui-bg: #f4f5f5;
        --ui-fg: #1a1a1a;
        --ui-muted: #6b6b6b;
        --ui-separator: #0d0d0d1a;
        --ui-accent: #2563eb;
      }
      body {
        margin: 0;
        background: var(--ui-bg);
        color: var(--ui-fg);
      }
      .region {
        padding: 16px;
        border-bottom: 1px solid var(--ui-separator);
      }
      .caption {
        margin: 0 0 10px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ui-muted);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
      }
      .switch {
        position: relative;
        display: inline-flex;
        height: 20px;
        width: 36px;
        align-items: center;
        border-radius: 999px;
        border: 1px solid var(--ui-separator);
        background: var(--ui-bg);
      }
      .switch-checked {
        border-color: color-mix(in oklab, var(--ui-accent) 40%, transparent);
        background: color-mix(in oklab, var(--ui-accent) 15%, transparent);
      }
      .switch-disabled {
        opacity: 0.45;
      }
      .thumb {
        height: 14px;
        width: 14px;
        border-radius: 999px;
        background: var(--ui-muted);
        transform: translateX(4px);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .switch-checked .thumb {
        transform: translateX(18px);
        background: var(--ui-accent);
      }
      .label {
        font-size: 13px;
        color: var(--ui-muted);
      }
    </style>
  </head>
  <body>
    <section class="region" data-theme="zai-dark" data-snapshot="theme-dark">
      <p class="caption">zai-dark · unchecked</p>
      <div class="row" data-snapshot="unchecked">
        <span class="switch"><span class="thumb"></span></span>
        <span class="label">Enable notifications</span>
      </div>
    </section>
    <section class="region" data-theme="zai-dark" data-snapshot="checked">
      <p class="caption">zai-dark · checked</p>
      <div class="row" data-snapshot="checked">
        <span class="switch switch-checked"><span class="thumb"></span></span>
        <span class="label">Disable notifications</span>
      </div>
    </section>
    <section class="region" data-theme="zai-dark" data-snapshot="disabled">
      <p class="caption">zai-dark · disabled</p>
      <div class="row">
        <span class="switch switch-disabled"><span class="thumb"></span></span>
        <span class="label">Locked preference</span>
      </div>
    </section>
    <section class="region" data-theme="zai-light" data-snapshot="theme-light">
      <p class="caption">zai-light · checked</p>
      <div class="row">
        <span class="switch switch-checked"><span class="thumb"></span></span>
        <span class="label">Disable notifications</span>
      </div>
    </section>
  </body>
</html>
