<!-- Not product authority. Synthetic, non-routable, script-free, and network-free parity fixture. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tabs parity fixture</title>
    <style>
      :root { --ui-bg:#141414; --ui-fg:#f2f2f2; --ui-muted:#9a9a9a; --ui-accent:#3b9eff; --ui-border:#303030; --color-tab:#202020; --color-tab-active:#303030; font-family:Geist,ui-sans-serif,system-ui,sans-serif; }
      [data-theme="zai-light"] { --ui-bg:#f4f5f5; --ui-fg:#1a1a1a; --ui-muted:#6b6b6b; --ui-accent:#2563eb; --ui-border:#0d0d0d1a; --color-tab:#ececec; --color-tab-active:#fff; }
      body { margin:0; background:var(--ui-bg); color:var(--ui-fg); }
      .region { padding:16px; border-bottom:1px solid var(--ui-border); background:var(--ui-bg); }
      .caption { margin:0 0 10px; color:var(--ui-muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
      .tabs { display:flex; gap:4px; overflow-x:auto; }
      button { border:0; background:transparent; color:var(--ui-muted); padding:7px 12px; font:inherit; white-space:nowrap; }
      .underline .active { color:var(--ui-fg); border-bottom:2px solid var(--ui-accent); }
      .pill button { border-radius:6px; }
      .pill .active { color:var(--ui-fg); background:var(--color-tab-active); }
      .group { width:max-content; padding:4px; border:1px solid var(--ui-border); border-radius:8px; }
      .group button { border-radius:6px; }
      .group .active { color:var(--ui-fg); background:var(--color-tab-active); }
    </style>
  </head>
  <body>
    <section class="region" data-theme="zai-dark" data-snapshot="underline">
      <p class="caption">zai-dark · underline</p>
      <div class="tabs underline"><button class="active">Overview</button><button>Details</button></div>
    </section>
    <section class="region" data-theme="zai-dark" data-snapshot="pill">
      <p class="caption">zai-dark · pill</p>
      <div class="tabs pill"><button>Overview</button><button class="active">Details</button></div>
    </section>
    <section class="region" data-theme="zai-light" data-snapshot="theme-light">
      <p class="caption">zai-light · button group</p>
      <div class="tabs group"><button class="active">Overview</button><button>Details</button></div>
    </section>
  </body>
</html>
