<!--
  Synthetic parity fixture for Button.
  Not product authority. Not routable. Script-free and network-free.
  Shared scenarios mirror tests/parity/manifests/button.json.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Button parity fixture (synthetic)</title>
    <style>
      :root {
        --ui-scale: 1;
        --ui-bg: #141414;
        --ui-fg: #f2f2f2;
        --ui-muted: #9a9a9a;
        --ui-border: #2a2a2a;
        --ui-surface: #1e1e1e;
        --ui-danger: #e35d5d;
        --ui-radius: 7px;
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
      }
      [data-theme="zai-light"] {
        --ui-bg: #f4f5f5;
        --ui-fg: #1a1a1a;
        --ui-muted: #6b6b6b;
        --ui-border: #0d0d0d1a;
        --ui-surface: #0d0d0d08;
        --ui-danger: #c23b3b;
      }
      body {
        margin: 0;
        background: var(--ui-bg);
        color: var(--ui-fg);
      }
      .region {
        padding: 16px;
        border-bottom: 1px solid var(--ui-border);
      }
      .caption {
        margin: 0 0 10px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ui-muted);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: var(--ui-radius);
        font-weight: 600;
        font-size: 13px;
        padding: 8px 16px;
        border: 0;
      }
      .btn-primary {
        background: color-mix(in oklab, var(--ui-fg) 90%, transparent);
        color: var(--ui-bg);
      }
      .btn-secondary {
        border: 1px solid color-mix(in oklab, var(--ui-border) 40%, transparent);
        background: transparent;
        color: var(--ui-muted);
      }
      .btn-danger {
        background: transparent;
        color: var(--ui-danger);
      }
      .btn-ghost {
        background: transparent;
        color: var(--ui-muted);
      }
      .btn-icon {
        padding: 6px;
        background: transparent;
        color: var(--ui-muted);
        border-radius: 8px;
      }
      .btn-disabled,
      .btn-loading {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <section class="region" data-theme="zai-dark" data-snapshot="theme-dark">
      <p class="caption">zai-dark · variants</p>
      <div class="row" data-snapshot="variants">
        <span class="btn btn-primary">Save draft</span>
        <span class="btn btn-secondary">Cancel</span>
        <span class="btn btn-danger">Remove item</span>
        <span class="btn btn-ghost">More options</span>
        <span class="btn btn-icon" aria-hidden="true">☰</span>
      </div>
    </section>
    <section class="region" data-theme="zai-dark" data-snapshot="states">
      <p class="caption">zai-dark · states</p>
      <div class="row">
        <span class="btn btn-primary btn-disabled">Save draft</span>
        <span class="btn btn-primary btn-loading">Saving</span>
      </div>
    </section>
    <section class="region" data-theme="zai-light" data-snapshot="theme-light">
      <p class="caption">zai-light · variants</p>
      <div class="row">
        <span class="btn btn-primary">Save draft</span>
        <span class="btn btn-secondary">Cancel</span>
        <span class="btn btn-danger">Remove item</span>
        <span class="btn btn-ghost">More options</span>
        <span class="btn btn-icon" aria-hidden="true">☰</span>
      </div>
    </section>
  </body>
</html>
