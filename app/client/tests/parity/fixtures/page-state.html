<!--
  Synthetic parity fixture for PageState.
  Not product authority. Not routable. Script-free and network-free.
  Shared scenarios mirror tests/parity/manifests/page-state.json.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PageState parity fixture (synthetic)</title>
    <style>
      :root {
        --ui-bg: #141414;
        --ui-fg: #f2f2f2;
        --ui-danger: #e35d5d;
        --dim: #9a9a9a;
        --fs-2xl: 24px;
        --fs-base: 14px;
        --leading-tight: 1.25;
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
      }
      [data-theme="zai-light"] {
        --ui-bg: #f4f5f5;
        --ui-fg: #1a1a1a;
        --ui-danger: #c23b3b;
        --dim: #6b6b6b;
      }
      body {
        margin: 0;
        background: var(--ui-bg);
        color: var(--ui-fg);
      }
      .region {
        padding: 16px;
        border-bottom: 1px solid color-mix(in oklab, var(--dim) 30%, transparent);
        min-height: 280px;
      }
      .caption {
        margin: 0 0 10px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .state {
        display: flex;
        min-height: 240px;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .panel {
        width: 100%;
        max-width: 520px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        margin-bottom: 12px;
        background: var(--dim);
      }
      .dot-danger {
        background: var(--ui-danger);
      }
      .title {
        margin: 0;
        font-size: var(--fs-2xl);
        font-weight: 600;
        line-height: var(--leading-tight);
      }
      .message {
        margin: 8px 0 0;
        font-size: var(--fs-base);
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <section class="region" data-theme="zai-dark" data-snapshot="theme-dark">
      <p class="caption">zai-dark · default tone</p>
      <div class="state" data-snapshot="default-tone">
        <div class="panel">
          <div class="dot"></div>
          <h1 class="title">Loading</h1>
          <p class="message">Resolving session.</p>
        </div>
      </div>
    </section>
    <section class="region" data-theme="zai-dark" data-snapshot="danger-tone">
      <p class="caption">zai-dark · danger tone</p>
      <div class="state" data-snapshot="danger-tone">
        <div class="panel">
          <div class="dot dot-danger"></div>
          <h1 class="title">Forbidden</h1>
          <p class="message">You do not have access to this surface.</p>
        </div>
      </div>
    </section>
    <section class="region" data-theme="zai-light" data-snapshot="theme-light">
      <p class="caption">zai-light · default tone</p>
      <div class="state">
        <div class="panel">
          <div class="dot"></div>
          <h1 class="title">Loading</h1>
          <p class="message">Resolving session.</p>
        </div>
      </div>
    </section>
  </body>
</html>
