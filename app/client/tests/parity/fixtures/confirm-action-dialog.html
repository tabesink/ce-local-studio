<!-- Not product authority. Synthetic data only. Script-free, network-free, and non-routable. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Confirm action dialog parity fixture</title>
    <style>
      :root {
        --ui-bg: #141414;
        --ui-fg: #f2f2f2;
        --ui-muted: #9a9a9a;
        --ui-surface: #1e1e1e;
        --ui-border: #303030;
        --danger: #e57373;
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
      }
      [data-theme="zai-light"] {
        --ui-bg: #f4f5f5;
        --ui-fg: #1a1a1a;
        --ui-muted: #666;
        --ui-surface: #fff;
        --ui-border: #d8d8d8;
        --danger: #a52828;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--ui-bg); color: var(--ui-fg); }
      .region { padding: 18px; border-bottom: 1px solid var(--ui-border); background: var(--ui-bg); }
      .caption { margin: 0 0 10px; color: var(--ui-muted); font: 11px Geist Mono, monospace; text-transform: uppercase; }
      .stage { min-height: 230px; padding: 24px; border-radius: 10px; background: color-mix(in oklab, var(--ui-bg) 72%, #000); }
      .dialog { max-width: 430px; margin: auto; overflow: hidden; border: 1px solid var(--ui-border); border-radius: 12px; background: var(--ui-surface); box-shadow: 0 20px 44px #0006; }
      .header { padding: 15px 20px; border-bottom: 1px solid var(--ui-border); }
      .header h2 { margin: 0; font-size: 16px; }
      .body { padding: 16px 20px; }
      .target { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
      .consequence { margin: 0; color: var(--ui-muted); font-size: 13px; line-height: 1.5; }
      .actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 20px 16px; }
      .action { padding: 7px 12px; border: 1px solid var(--ui-border); border-radius: 6px; font-size: 13px; }
      .danger { border-color: color-mix(in oklab, var(--danger) 55%, var(--ui-border)); color: var(--danger); }
    </style>
  </head>
  <body>
    <section class="region" data-theme="zai-dark" data-snapshot="theme-dark-open">
      <p class="caption">Synthetic destructive confirmation · dark</p>
      <div class="stage"><div class="dialog">
        <div class="header"><h2>Remove synthetic item?</h2></div>
        <div class="body"><p class="target">Sample handbook</p><p class="consequence">This removes the item from this synthetic view.</p></div>
        <div class="actions" data-snapshot="dialog-actions"><span class="action">Cancel</span><span class="action danger">Remove</span></div>
      </div></div>
    </section>
    <section class="region" data-theme="zai-light" data-snapshot="theme-light-open">
      <p class="caption">Synthetic destructive confirmation · light</p>
      <div class="stage"><div class="dialog">
        <div class="header"><h2>Remove synthetic item?</h2></div>
        <div class="body"><p class="target">Sample handbook</p><p class="consequence">This removes the item from this synthetic view.</p></div>
        <div class="actions"><span class="action">Cancel</span><span class="action danger">Remove</span></div>
      </div></div>
    </section>
  </body>
</html>
