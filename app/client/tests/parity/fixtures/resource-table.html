<!-- Not product authority. Synthetic data only. Script-free, network-free, and non-routable. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Resource table parity fixture</title>
    <style>
      :root {
        --ui-bg: #141414;
        --ui-fg: #f2f2f2;
        --ui-muted: #9a9a9a;
        --ui-surface: #1e1e1e;
        --ui-border: #303030;
        --link: #78a9ff;
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
      }
      [data-theme="zai-light"] {
        --ui-bg: #f4f5f5;
        --ui-fg: #1a1a1a;
        --ui-muted: #666;
        --ui-surface: #fff;
        --ui-border: #d8d8d8;
        --link: #245fbd;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--ui-bg); color: var(--ui-fg); }
      .region { padding: 20px; border-bottom: 1px solid var(--ui-border); background: var(--ui-bg); }
      .caption { margin: 0 0 10px; color: var(--ui-muted); font: 11px/1.4 Geist Mono, monospace; text-transform: uppercase; }
      .table { max-width: 620px; overflow: hidden; border: 1px solid var(--ui-border); border-radius: 8px; background: var(--ui-surface); }
      .row { display: grid; grid-template-columns: minmax(0, 1fr) 130px; min-height: 38px; align-items: center; border-top: 1px solid var(--ui-border); }
      .row:first-child { border-top: 0; }
      .header { min-height: 30px; color: var(--ui-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
      .cell { min-width: 0; padding: 8px 12px; font-size: 13px; }
      .selected { box-shadow: inset 3px 0 var(--link); background: color-mix(in oklab, var(--link) 8%, var(--ui-surface)); }
      .selected .cell:first-child::after { content: "Selected"; margin-left: 8px; color: var(--link); font: 10px Geist Mono, monospace; text-transform: uppercase; }
      .status { color: var(--ui-muted); }
      @media (max-width: 460px) {
        .region { padding: 12px; }
        .row { grid-template-columns: minmax(150px, 1fr) 100px; }
      }
    </style>
  </head>
  <body>
    <section class="region" data-theme="zai-dark" data-snapshot="theme-dark">
      <p class="caption">Synthetic resources · dark</p>
      <div class="table">
        <div class="row header"><div class="cell">Resource</div><div class="cell">Status</div></div>
        <div class="row selected" data-snapshot="selected-row">
          <div class="cell">Sample handbook</div><div class="cell status">Available</div>
        </div>
        <div class="row"><div class="cell">Example checklist</div><div class="cell status">Draft</div></div>
      </div>
    </section>
    <section class="region" data-theme="zai-light" data-snapshot="theme-light">
      <p class="caption">Synthetic resources · light</p>
      <div class="table">
        <div class="row header"><div class="cell">Resource</div><div class="cell">Status</div></div>
        <div class="row selected"><div class="cell">Sample handbook</div><div class="cell status">Available</div></div>
        <div class="row"><div class="cell">Example checklist</div><div class="cell status">Draft</div></div>
      </div>
    </section>
  </body>
</html>
